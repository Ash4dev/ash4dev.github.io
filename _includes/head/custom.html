<!-- ==========================================
     THEME TOGGLE LAYOUT
     ========================================== -->

<style>
  /* Navigation and toggle share available header space */
  .masthead__menu {
    display: flex !important;
    align-items: center !important;
    width: 100% !important;
  }

  /* Navigation takes all remaining space */
  #site-nav {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    width: auto !important;
  }

  /* Toggle occupies its own space */
  #theme-toggle {
    position: static !important;
    transform: none !important;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    flex: 0 0 38px;

    width: 38px;
    height: 38px;

    margin: 0 0 0 12px;
    padding: 0;

    border: 1px solid currentColor;
    border-radius: 50%;

    color: inherit;
    background: transparent;

    font-size: 20px;
    line-height: 1;

    cursor: pointer;
  }

  #theme-toggle:hover {
    opacity: 0.7;
  }

  #theme-toggle:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }

  /* Light mode avatar visibility */
  html[data-theme="light"] .author__avatar img {
    opacity: 1 !important;
    filter: none !important;
    border: 3px solid #fff !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  }

  /* Dark mode avatar visibility */
  html[data-theme="dark"] .author__avatar img {
    opacity: 1 !important;
    filter: none !important;
    border: 3px solid #383838 !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  /* Desktop: show all navigation links */
@media (min-width: 1200px) {

  #site-nav .visible-links {
    display: flex !important;
    overflow: visible !important;
    flex-wrap: nowrap !important;
  }

  #site-nav .greedy-nav__toggle {
    display: none !important;
  }

  #site-nav .hidden-links {
    display: none !important;
  }

}

</style>
