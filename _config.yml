# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: segfaulter
email: ashutoshp.iitkgp@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Engineering hardware concious software, one bug at a time.
  A low-level systems programming blog exploring C++, computer architecture, concurrency, and operating systems applied to low-latency quantitative finance.
github_username: ash4dev
minimal_mistakes_skin: neon
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Ashutosh Panigrahy"
  avatar : "/assets/images/cover.png"
  bio    : "Exploring performance-critical C++, concurrency, and computer architecture through the lens of low-latency finance."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:ashutoshp.iitkgp@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ashutosh-panigrahy/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Ash4dev"
    - label: "Getcracked"
      icon: "fa-solid fa-code"
      url: "https://getcracked.io/statistics/cmol1075f0c4jc42m6ruxh23h"
    - label: "LeetCode"
      icon: "fas fa-fw fa-laptop-code"
      url: "https://leetcode.com/u/user0075pe/"

footer:
  links:
    - label: "Mech Sympathy"
      icon: "fas fa-fw fa-globe"
      url: "https://mechanical-sympathy.blogspot.com/"
    - label: "MIT Perf Eng"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/playlist?list=PLUl4u3cNGP63VIBQVWguXxZZi0566y7Wf"
    - label: "Onur Mutlu"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://people.inf.ethz.ch/omutlu/"
    - label: "CppInsights"
      icon: "fas fa-fw fa-code"
      url: "https://cppinsights.io/"
    - label: "CppReference"
      icon: "fas fa-fw fa-book"
      url: "https://en.cppreference.com/w/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
